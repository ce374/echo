buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

// Read optional signing config from local.properties (CI keystore pattern).
Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def hasSigning = localProps.getProperty('signingConfig.storeFile') != null

android {
    namespace 'eu.mrogalski.saidit'
    compileSdk 34

    defaultConfig {
        applicationId "eu.mrogalski.saidit"
        minSdk 30
        targetSdk 34
        versionCode 16
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(localProps.getProperty('signingConfig.storeFile'))
                storePassword localProps.getProperty('signingConfig.storePassword')
                keyAlias localProps.getProperty('signingConfig.keyAlias')
                keyPassword localProps.getProperty('signingConfig.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFile file('proguard.cfg')
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {}
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
