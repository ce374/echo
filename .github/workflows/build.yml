name: Build Echo

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Provision signing config
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LOCAL_PROPS: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -e
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | tr -d '\n' | base64 -d > SaidIt/release_keystore.jks
            printf '%s\n' "$LOCAL_PROPS" > local.properties
          else
            keytool -genkeypair -v \
              -keystore SaidIt/release_keystore.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias echo-ci -storepass echoci -keypass echoci \
              -dname "CN=Echo CI, OU=Build, O=Echo, L=NA, ST=NA, C=NA"
            printf 'signingConfig.storeFile=SaidIt/release_keystore.jks\nsigningConfig.storePassword=echoci\nsigningConfig.keyAlias=echo-ci\nsigningConfig.keyPassword=echoci\n' > local.properties
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish built APK to public/
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' SaidIt/build.gradle)
          OUT_DIR="SaidIt/build/outputs/apk/release"
          APK_SRC="$(ls "$OUT_DIR"/*-release.apk 2>/dev/null | head -1)"
          if [ -z "$APK_SRC" ]; then
            echo "::error::No release APK found"; ls -lhR "$OUT_DIR"; exit 1
          fi
          APK_NAME="Echo-${VERSION}.apk"
          mkdir -p public
          cp "$APK_SRC" "public/$APK_NAME"
          SIZE=$(stat -c%s "public/$APK_NAME")
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -lt 1000000 ] && { echo "::error::APK too small ($SIZE)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "public/$APK_NAME"
          if ! git diff --staged --quiet; then
            git commit -m "ci: publish built APK ${VERSION} [skip ci]"
            git push
          else
            echo "No changes to publish."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-release-apk
          path: |
            SaidIt/build/outputs/apk/release/*-release.apk
            public/*.apk
          if-no-files-found: error
